{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนรหัสผ่านสำเร็จ | ร้านผัดกะเพรารวมมิตร</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Prompt', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9966 0%, #ff5e62 50%, #d31027 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem; position: relative; overflow: hidden;
        }
        .card {
            width: 100%; max-width: 460px;
            background: #fff; border: none; border-radius: 24px;
            padding: 2.5rem 2rem; box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            position: relative; z-index: 10; text-align: center;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .icon-circle {
            width: 84px; height: 84px; margin: 0 auto 1.25rem;
            border-radius: 50%; background: linear-gradient(135deg, #ff9966, #ff5e62);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; color: #fff;
            box-shadow: 0 10px 25px rgba(255,94,98,0.45);
        }
        .title { font-weight: 700; color: #333; }
        .msg { color: #666; font-size: 0.95rem; line-height: 1.7; }
        .btn-main {
            display: inline-block; padding: 0.7rem 1.8rem; border: none; border-radius: 14px;
            font-weight: 600; color: #fff; text-decoration: none;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            box-shadow: 0 8px 20px rgba(255,94,98,0.4); transition: all 0.25s;
        }
        .btn-main:hover { transform: translateY(-2px); color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">🎉</div>
        <h1 class="title h4 mb-3">เปลี่ยนรหัสผ่านเรียบร้อยแล้ว</h1>
        <p class="msg">คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที</p>
        <div class="mt-4">
            <a href="{% url 'login' %}" class="btn-main">
                <i class="bi bi-box-arrow-in-right me-1"></i> ไปเข้าสู่ระบบ
            </a>
        </div>
    </div>
</body>
</html>
