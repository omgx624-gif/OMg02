<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | ไม่พบหน้า</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
            max-width: 460px;
            width: 100%;
        }
        .emoji {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: .75rem;
        }
        .code {
            font-size: 7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
        }
        .btn-gradient {
            color: #fff;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            border: none;
            border-radius: .8rem;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(255, 94, 98, .35);
        }
        .btn-gradient:hover {
            color: #fff;
            filter: brightness(1.06);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 94, 98, .45);
        }
    </style>
</head>
<body>
    <div class="card text-center mx-3">
        <div class="card-body p-5">
            <div class="emoji">🔍</div>
            <h1 class="code">404</h1>
            <h3 class="fw-bold mt-3 mb-2">ไม่พบหน้าที่ค้นหา</h3>
            <p class="text-muted mb-4">
                หน้าที่คุณต้องการอาจถูกลบ เปลี่ยนชื่อ หรือไม่มีอยู่ในระบบ
                <br>ลองตรวจสอบที่อยู่อีกครั้ง หรือเลือกดูเมนูอาหารของเราแทนได้เลย
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="/" class="btn btn-gradient px-4">กลับหน้าหลัก</a>
                <a href="/menu/" class="btn btn-outline-secondary px-4">ดูเมนู</a>
            </div>
        </div>
    </div>
</body>
</html>
